<!-- Modal de Ticket -->
<div class="modal fade" id="ticketModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background: #28a745; color: white;">
                <h5 class="modal-title">
                    <i class="fas fa-receipt"></i> Ticket de Pago
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="ticketContent" class="ticket-content" style="max-height: 500px; overflow-y: auto;">
                    <!-- Se llena vía JS -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button class="btn btn-primary" onclick="printTicket()">
                    <i class="fas fa-print"></i> Imprimir Ticket
                </button>
                <button class="btn btn-success" onclick="downloadTicket()">
                    <i class="fas fa-download"></i> Descargar PDF
                </button>
            </div>
        </div>
    </div>
</div>
