<!-- sales/modules/_cart.html -->
<div class="pos-cart">
    <div class="cart-header">
        <span class="cart-title">
            <i class="fas fa-shopping-cart"></i> Carrito
        </span>
        <span class="order-info" id="cartOrderInfo">
            <i class="fas fa-receipt"></i> #<span id="orderNumber">0</span>
        </span>
    </div>
    <div class="cart-body" id="cartItems">
        <div class="cart-empty">
            <i class="fas fa-shopping-basket"></i>
            <p>Agrega productos al carrito</p>
        </div>
    </div>
    <div class="cart-footer">
        <div class="totals">
            <span class="label">Subtotal</span>
            <span class="value" id="cartSubtotal">$0.00</span>
        </div>
        <div class="totals">
            <span class="label">IVA (16%)</span>
            <span class="value" id="cartTax">$0.00</span>
        </div>
        <div class="totals grand-total">
            <span class="label" style="font-weight: 700;">Total</span>
            <span class="value" id="cartTotal">$0.00</span>
        </div>
        <button class="btn-checkout" id="checkoutBtn" disabled onclick="processCheckout()">
            <i class="fas fa-credit-card"></i> Cobrar
        </button>
    </div>
</div>
