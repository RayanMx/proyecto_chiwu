{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Marketing - Chiwu{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="fas fa-bullhorn"></i> Marketing</h4>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <i class="fas fa-envelope fa-3x text-primary"></i>
                <h5 class="mt-2">Email Marketing</h5>
                <p class="text-muted small">Envía promociones a tus clientes</p>
                <button class="btn btn-sm btn-primary">Configurar</button>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <i class="fab fa-whatsapp fa-3x text-success"></i>
                <h5 class="mt-2">WhatsApp</h5>
                <p class="text-muted small">Mensajes automatizados</p>
                <button class="btn btn-sm btn-success">Configurar</button>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <i class="fas fa-tags fa-3x text-warning"></i>
                <h5 class="mt-2">Promociones</h5>
                <p class="text-muted small">Crea ofertas especiales</p>
                <button class="btn btn-sm btn-warning">Configurar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
